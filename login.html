<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Intelligential</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 dark:bg-gray-950">

    <!-- NAVBAR -->
    <nav class="bg-white dark:bg-gray-900 shadow-lg fixed top-0 w-full z-50">
        <div class="max-w-6xl mx-auto p-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-purple-600 dark:text-purple-400">Intelligential</h1>

            <button onclick="toggleDarkMode()"
                class="px-4 py-2 rounded-lg bg-purple-600 text-white hover:bg-purple-700 transition">
                🌙
            </button>
        </div>
    </nav>

    <!-- LOGIN FORM -->
    <div class="min-h-screen flex items-center justify-center p-6 pt-28">
        <div class="bg-white dark:bg-gray-900 shadow-xl rounded-2xl p-10 w-full max-w-md">

            <h2 class="text-3xl font-bold text-center mb-6 text-purple-600 dark:text-purple-400">
                Welcome Back
            </h2>

            <form id="login-form" onsubmit="loginDemo(event)" class="space-y-4">
                <!-- EMAIL -->
                <div>
                    <label class="block mb-1 text-gray-700 dark:text-gray-300">Email</label>
                    <input type="email" name="email" required
                        class="w-full p-3 rounded-lg bg-gray-100 dark:bg-gray-800 dark:text-white border border-gray-300 dark:border-gray-700 focus:ring-2 focus:ring-purple-500 outline-none"
                        placeholder="you@example.com">
                </div>

                <!-- PASSWORD -->
                <div>
                    <label class="block mb-1 text-gray-700 dark:text-gray-300">Password</label>
                    <input type="password" name="password" required
                        class="w-full p-3 rounded-lg bg-gray-100 dark:bg-gray-800 dark:text-white border border-gray-300 dark:border-gray-700 focus:ring-2 focus:ring-purple-500 outline-none"
                        placeholder="Enter password">
                </div>

                <!-- LOGIN BUTTON -->
                <button type="submit"
                    class="w-full bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 transition font-semibold">
                    Login
                </button>
            </form>

            <!-- SIGN UP OPTION -->
            <div class="mt-6 text-center">
                <p class="text-gray-700 dark:text-gray-300">
                    Don't have an account?
                    <a href="signup.html" class="text-purple-600ss dark:text-purple-400 font-semibold hover:underline">
                        Create one here
                    </a>
                </p>
            </div>

        </div>
    </div>

    <script src="auth.js"></script>
    <script src="script.js"></script>

</body>
</html>
