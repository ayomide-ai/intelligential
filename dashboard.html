 <!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Dashboard — Intelligential</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <script src="auth.js"></script>
  <script>
    // Protect page
    if (!requireAuth(true)) {
      // requireAuth redirects to login if missing
    }
  </script>

  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand"><div class="logo">🎓</div><div style="font-weight:800;color:white">Intelligential</div></div>
      <div class="nav-links">
        <button onclick="location.href='./home.html'">Home</button>
        <button onclick="logoutDemo()" style="background:none;border:none;color:white">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-top:120px">
  
    <section class="section">
      <h1>Dashboard</h1>
      <div class="card" id="profile-card" <button onclick="location.href='./home.html'">Home</button>>
        <h3>User</h3>
        <p class="text-muted" id="profile-info">—</p>
         
      </div>

      <div class="card">
        <h3>My Courses</h3>
        <p class="text-muted">Your enrolled courses will appear here (demo).</p>
      </div>
    </section>
  </main>

  <script>
    // populate user details
    document.addEventListener('DOMContentLoaded', () => {
      const u = currentUser();
      const el = document.getElementById('profile-info');
      if (u && el) el.textContent = `${u.name} • ${u.email}`;
    });
  </script>
</body>
</html>
