<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Contact — Intelligential</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <div id="particles-container"></div>
  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand" onclick="location.href='./index.html'"><div class="logo">🎓</div><div><div style="font-weight:800">Intelligential</div></div></div>
      <div class="nav-links" id="nav-links">
        <button onclick="location.href='./home.html'">Home</button>
        <button onclick="location.href='./features.html'">Features</button>
        <button onclick="location.href='./about.html'">About</button>
        <button onclick="location.href='./contact.html'">Contact</button>
        <button onclick="location.href='./index.html'">Login</button>
        <button onclick="toggleTheme()" class="btn-ghost">Toggle Theme</button>
      </div>
      <button id="hamburger-btn" class="hamburger">☰</button>
    </div>
  </nav>

  <main class="container" style="padding-top:120px">
    <section class="section">
      <div style="text-align:center;margin-bottom:20px">
        <h1 class="slide-in-left">Get In Touch</h1>
        <p class="text-muted">Ready to start? Send us a message and we’ll get back to you.</p>
      </div>

      <div class="contact-grid">
        <form data-contact="true" class="card" onsubmit="handleContactForm(event)">
          <h3>Send us a message</h3>
          <label class="text-muted">Full name</label>
          <input class="form-input" name="name" required>
          <label class="text-muted">Email</label>
          <input class="form-input" name="email" type="email" required>
          <label class="text-muted">Subject</label>
          <select name="subject" class="form-select">
            <option>General Inquiry</option>
            <option>Support</option>
            <option>Partnership</option>
          </select>
          <label class="text-muted">Message</label>
          <textarea class="form-input" name="message" rows="6" required></textarea>
          <button type="submit" class="cta" style="background:var(--accent1);color:white;border:none">Send Message</button>
        </form>

        <aside>
          <div class="card">
            <h3>Contact Information</h3>
            <p><strong>Email:</strong> <span id="contact-email"></span></p>
            <p><strong>Phone:</strong> <span id="contact-phone"></span></p>
            <p><strong>Address:</strong> <span id="contact-address"></span></p>
          </div>

          <div class="card" style="margin-top:18px;background:linear-gradient(90deg,var(--gold),#f97316);color:white">
            <h3>Ready to Transform Your Learning?</h3>
            <p>Join thousands of students already achieving their goals.</p>
            <div style="margin-top:12px">
              <a class="cta" href="./features.html" style="background:white;color:var(--accent1)">Explore Features</a>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="footer"><div class="container">© Intelligential</div></footer>
  <script src="script.js"></script>
</body>
</html>
<script>
  // Populate contact info

  document.getElementById('contact-email').textContent = 'contact@intelligential.com';
